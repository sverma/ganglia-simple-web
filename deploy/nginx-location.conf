location = /ganglia2 { return 302 /ganglia2/; }
location = /ganglia2/cli.html { return 302 /ganglia2/cli.php; }

location ^~ /ganglia2/ {
    root /var/www/ganglia-monitoring;
    index index.php;
    auth_basic "Ganglia monitoring";
    auth_basic_user_file /etc/nginx/ganglia.htpasswd;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Only reviewed monitoring entry points are executable.
    location ~ ^/ganglia2/(?:index|graphs|create_graph_panel|inner_panel|metric_table|alerts|cli|application|api/webservice)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/ganglia2-fpm.sock;
        fastcgi_read_timeout 30s;
    }
    location ~ ^/ganglia2/(?:js/(?:deployment|cli)\.js|css/deployment\.css|favicon\.ico)$ {
        try_files $uri =404;
    }
    location ~ ^/ganglia2/.+ { return 404; }
    try_files $uri $uri/ =404;
}
