[ganglia2]
user = ganglia2-web
group = ganglia2-web
listen = /run/php/ganglia2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 300
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = yes
env[TZ] = UTC
env[PATH] = /usr/bin:/bin
env[GANGLIA_WEB_CONFIG] = /etc/ganglia-simple-web/config.php
php_admin_value[date.timezone] = UTC
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 25
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_value[session.save_path] = /var/lib/ganglia2-web/sessions
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.cookie_path] = /ganglia2/
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,pcntl_exec
security.limit_extensions = .php
